name: Build Android App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libsqlite3-dev libffi-dev autoconf automake libtool pkg-config cmake libncurses6 libncurses-dev libtinfo6 libssl-dev

      # 新対策】 不足していた Android SDK、Build-Tools (Aidl含む) を直接Linuxマシン内に事前構築します
      - name: Setup Android SDK and Build-Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://google.com
          unzip commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          # ライセンスの自動承認と、必要な部品（API 34用のbuild-tools等）の直接インストール
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          # Buildozerが認識できるように、要求された場所にフォルダをリンク（共有）させます
          mkdir -p $HOME/.buildozer/android/platform
          ln -s $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk

      - name: Install Buildozer directly
        run: |
          pip install --upgrade pip
          pip install Cython virtualenv sh
          pip install buildozer

      - name: Execute Buildozer Build
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
