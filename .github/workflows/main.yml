name: Build Android App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # JavaとAndroid SDKを最も省メモリで展開する公式の推奨ルートを設定します
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Component
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          mkdir -p $HOME/.buildozer/android/platform
          ln -s $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk

      # 必要最小限のLinuxツールのみを追加してメモリを強力に節約します
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev libffi-dev autoconf automake libtool pkg-config cmake libncurses6 libncurses-dev libtinfo6 libssl-dev

      - name: Install Buildozer directly
        run: |
          pip install --upgrade pip
          pip install Cython virtualenv sh
          pip install buildozer

      # サーバーが気絶（メモリ不足）しないよう、並列数を1に制限してビルドを実行します
      - name: Execute Buildozer Build
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          buildozer -v android debug p4a.extra_args="--workers=1"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
